<body>

<header>
  <div class="brand">TWiST <span class="accent">Sentinel</span></div>
  <div id="status" class="status disconnected">
    <span class="dot"></span><span class="label">connecting…</span>
  </div>
</header>

<div id="auth-overlay" class="auth-overlay hidden">
  <form class="auth-card" id="auth-form">
    <div class="auth-title">Sentinel Access</div>
    <input type="password" class="auth-input" id="auth-input" placeholder="Enter access token" autocomplete="off" />
    <button type="submit" class="auth-button">Connect</button>
    <div class="auth-error" id="auth-error"></div>
  </form>
</div>

<div id="session-bar" class="session-bar idle"></div>
<div id="demo-bar" class="demo-bar"></div>

<main>
  <section id="transcript-pane">
    <div id="transcript">
      <div class="empty-state">Stream idle.</div>
    </div>
  </section>
  <aside id="sidebar-pane">
    <div id="customize-panel" class="customize-panel">
      <div class="customize-header" id="customize-toggle">
        <span>Customize</span>
        <span class="customize-caret">▾</span>
      </div>
      <div class="customize-body">
        <div class="customize-row">
          <span class="customize-label">Mode</span>
          <select class="customize-select" id="customize-mode">
            <option value="producer">Producer</option>
            <option value="on-air">On-Air</option>
            <option value="analyst">Analyst</option>
            <option value="cynic">Cynic</option>
          </select>
        </div>
        <div class="customize-row">
          <span class="customize-label">Length</span>
          <div class="customize-slider-row">
            <input type="range" class="customize-slider" id="customize-length" min="0" max="3" step="1" value="1" />
            <span class="customize-slider-value" id="customize-length-value">Default <span class="customize-slider-num">28</span></span>
          </div>
        </div>
        <div class="customize-row">
          <span class="customize-label">Strictness</span>
          <div class="customize-segmented" id="customize-strictness">
            <button data-value="tier1">Tier 1</button>
            <button data-value="balanced">Balanced</button>
            <button data-value="broad">Broad</button>
          </div>
        </div>
        <div class="customize-row">
          <span class="customize-label">Density</span>
          <div class="customize-segmented" id="customize-density">
            <button data-value="quiet">Quiet</button>
            <button data-value="normal">Normal</button>
            <button data-value="aggressive">Aggro</button>
          </div>
        </div>
        <div class="customize-footnote">Voice changes wording. Evidence stays locked.</div>
      </div>
    </div>
    <div class="sidebar-title">
      <span>THE DOCKET</span>
      <span class="claim-count" id="claim-count-display">0 CLAIMS</span>
    </div>
    <div id="sidebar">
      <div class="empty-state empty-state-listening">
        <div class="empty-state-primary">Listening for checkable claims</div>
        <div class="empty-state-sub">Classifier active · Sources ready</div>
      </div>
    </div>
    <div id="follow-banner" class="follow-banner hidden">0 new claims ↑</div>
    <div id="pipeline-stats" class="pipeline-stats hidden"></div>
    <div id="citation-tooltip" class="citation-tooltip" role="tooltip"></div>
  </aside>
</main>

<script>
(() => {
  // ─── Auth ───────────────────────────────────────────────────
  let token = sessionStorage.getItem('sentinel_token') || null;
  const authOverlay = document.getElementById('auth-overlay');
  const authInput = document.getElementById('auth-input');
  const authError = document.getElementById('auth-error');
  const authForm = document.getElementById('auth-form');

  function promptForToken(errorMsg) {
    if (errorMsg) authError.textContent = errorMsg;
    authOverlay.classList.remove('hidden');
    authInput.focus();
  }

  authForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = authInput.value.trim();
    if (!v) return;
    sessionStorage.setItem('sentinel_token', v);
    location.reload();
  });

  async function authFetch(url, init) {
    const hadToken = !!token;
    const headers = new Headers((init && init.headers) || {});
    if (token) headers.set('Authorization', `Bearer ${token}`);
    const res = await fetch(url, { ...(init || {}), headers });
    if (res.status === 401) {
      sessionStorage.removeItem('sentinel_token');
      token = null;
      // First-load 401 (no token to begin with) just means "auth required" —
      // don't accuse the user of submitting a bad token they never submitted.
      promptForToken(hadToken ? 'Invalid token' : undefined);
      throw new Error('Unauthorized');
    }
    return res;
  }

  // ─── Session control bar ──────────────────────────────────
  // Uses `escape` defined later in this IIFE under Utilities — hoisted by
  // closure scope, available by the time renderSessionBar is invoked.
  const sessionBar = document.getElementById('session-bar');
  const demoBar = document.getElementById('demo-bar');
  const session = { state: 'idle', url: null, error: null, deepgramHealth: { state: 'connected' } };

  // Secondary-row quick actions. Shown only in idle+youtube; hidden in
  // connecting/live/error and in system-audio mode so the bar stays clean.
  function renderDemoBar(visible) {
    if (!visible) {
      demoBar.className = 'demo-bar';
      demoBar.innerHTML = '';
      return;
    }
    demoBar.className = 'demo-bar visible';
    demoBar.innerHTML = `
      <span class="demo-bar-label">Quick start:</span>
      <button id="demo-twist">Try with latest TWiST episode</button>
      <button id="demo-capture" class="disabled" style="display:none" title="Coming soon — capture audio from any browser tab">Capture Browser Audio (coming soon)</button>
    `;
    document.getElementById('demo-twist').addEventListener('click', startDemo);
    document.getElementById('demo-capture').addEventListener('click', () => {
      window.alert('Coming soon — capture audio from any browser tab.');
    });
  }

  async function startDemo() {
    try {
      const r = await authFetch('/api/session/demo', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({}),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        renderSessionBar(err.error || `Demo failed (${r.status})`);
      }
    } catch {
      // authFetch already surfaced any 401.
    }
  }
  // Mode persists in sessionStorage so a reload keeps the operator in the
  // mode they were using ('youtube' or 'system-audio').
  let sessionMode = sessionStorage.getItem('sentinel_session_mode') === 'system-audio'
    ? 'system-audio'
    : 'youtube';
  function setSessionMode(next) {
    sessionMode = next;
    sessionStorage.setItem('sentinel_session_mode', next);
    renderSessionBar();
  }

  function renderDeepgramHealth() {
    const dh = session.deepgramHealth;
    if (dh.state === 'connected') return '';
    if (dh.state === 'reconnecting') {
      return `<span class="deepgram-health reconnecting"><span class="deepgram-dot"></span>Reconnecting (attempt ${dh.attempt || '?'})…</span>`;
    }
    return `<span class="deepgram-health disconnected"><span class="deepgram-dot"></span>Connection lost</span>`;
  }

  function renderSessionBar(transientError) {
    sessionBar.className = `session-bar ${session.state}`;
    if (transientError) {
      sessionBar.innerHTML = `
        <span class="session-dot"></span>
        <span class="session-label">Error</span>
        <span class="session-error-msg">${escape(transientError)}</span>
        <button class="session-action primary" id="session-dismiss">Dismiss</button>
      `;
      document.getElementById('session-dismiss').addEventListener('click', () => renderSessionBar());
      renderDemoBar(false);
      return;
    }
    if (session.state === 'idle') {
      const toggle = `
        <div class="session-mode-toggle">
          <button data-mode="youtube" class="${sessionMode === 'youtube' ? 'active' : ''}">YouTube</button>
          <button data-mode="system-audio" class="${sessionMode === 'system-audio' ? 'active' : ''}">System Audio</button>
        </div>
      `;
      if (sessionMode === 'youtube') {
        sessionBar.innerHTML = `
          <span class="session-dot"></span>
          ${toggle}
          <input class="session-input" id="session-url" type="url" placeholder="Paste YouTube URL..." />
          <button class="session-action primary" id="session-start">Start Stream</button>
        `;
        const inp = document.getElementById('session-url');
        const btn = document.getElementById('session-start');
        btn.addEventListener('click', () => startYouTube(inp.value));
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') startYouTube(inp.value); });
      } else {
        sessionBar.innerHTML = `
          <span class="session-dot"></span>
          ${toggle}
          <span class="session-helper">Captures local Mac system audio via BlackHole. For Zoom, route Zoom output to BlackHole 2ch.</span>
          <button class="session-action primary" id="session-start">Start Capture</button>
        `;
        document.getElementById('session-start').addEventListener('click', () => startSystemAudio());
      }
      sessionBar.querySelectorAll('.session-mode-toggle button').forEach((b) => {
        b.addEventListener('click', () => setSessionMode(b.dataset.mode));
      });
      renderDemoBar(sessionMode === 'youtube');
    } else if (session.state === 'connecting') {
      sessionBar.innerHTML = `
        <span class="session-dot"></span>
        <span class="session-label">Connecting…</span>
        <span class="session-url">${escape(session.url || '')}</span>
        <button class="session-action danger" id="session-stop">Stop</button>
      `;
      document.getElementById('session-stop').addEventListener('click', stopSession);
      renderDemoBar(false);
    } else if (session.state === 'live') {
      sessionBar.innerHTML = `
        <span class="session-dot"></span>
        <span class="session-label">Live</span>
        <span class="session-url">${escape(session.url || '')}</span>
        ${renderDeepgramHealth()}
        <button class="session-action danger" id="session-stop">Stop</button>
      `;
      document.getElementById('session-stop').addEventListener('click', stopSession);
      renderDemoBar(false);
    } else { // error
      const err = session.error || {};
      const msg = err.message || 'Session failed';
      const hint = err.hint || '';
      const showRetry = err.retryable !== false;
      sessionBar.innerHTML = `
        <span class="session-dot"></span>
        <span class="session-label">Error</span>
        <span class="session-error-msg" title="${escape(err.detail || msg)}">${escape(msg)}</span>
        ${hint ? `<span class="session-error-hint" title="${escape(hint)}">${escape(hint)}</span>` : ''}
        <button class="session-action secondary" id="session-copy">Copy diagnostic</button>
        ${showRetry ? '<button class="session-action primary" id="session-retry">Retry</button>' : ''}
      `;
      document.getElementById('session-copy').addEventListener('click', () => copyDiagnostic());
      const retryBtn = document.getElementById('session-retry');
      if (retryBtn) retryBtn.addEventListener('click', () => {
        session.state = 'idle';
        session.url = null;
        session.error = null;
        renderSessionBar();
      });
      renderDemoBar(false);
    }
  }

  function copyDiagnostic() {
    const e = session.error || {};
    const text = [
      `code: ${e.code || 'UNKNOWN'}`,
      `source: ${e.source || 'unknown'}`,
      `message: ${e.message || ''}`,
      e.detail ? `detail: ${e.detail}` : '',
      e.hint ? `hint: ${e.hint}` : '',
      e.retryable !== undefined ? `retryable: ${e.retryable}` : '',
    ].filter(Boolean).join('\n');
    (navigator.clipboard?.writeText(text) || Promise.reject()).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    });
    const btn = document.getElementById('session-copy');
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = prev; }, 1200);
    }
  }

  async function postStart(body) {
    try {
      const speakerNames = state.session.sessionContext.speakerNames || {};
      const r = await authFetch('/api/session/start', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          ...body,
          speakerMap: state.session.speakerMap || {},
          speakerNames,
        }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        renderSessionBar(err.error || `Start failed (${r.status})`);
      }
      // On success the server broadcasts session_state=connecting, the bar
      // re-renders via the WS handler. The full structured error (if any)
      // arrives the same way on async pipeline failures.
    } catch {
      // authFetch already surfaced any 401.
    }
  }

  async function startYouTube(urlValue) {
    const url = (urlValue || '').trim();
    if (!url) return;
    return postStart({ mode: 'youtube', url });
  }

  async function startSystemAudio() {
    return postStart({ mode: 'system-audio' });
  }

  async function stopSession() {
    try {
      await authFetch('/api/session/stop', { method: 'POST' });
    } catch {}
  }

  // ─── State ──────────────────────────────────────────────────
  const PENDING_TTL_MS = 60_000; // auto-clear pending claims that never resolve
  const state = {
    segments: [],          // append-only ring of TranscriptSegment
    cards: [],             // newest-first cards (max 10)
    segmentsWithClaims: new Set(), // segmentId → true
    // claimId → { stage, primaryEntity, claimText, updatedAt }
    // Cleared when the matching claim_card arrives or after PENDING_TTL_MS.
    pending: new Map(),
    latestStats: null,         // most recent pipeline_stats msg — drives empty-state numbers
    classifierHealth: 'live',  // updated on 'status' WS msgs — drives pill + empty-state primary
    // Session metadata cached from /api/session/status — drives the
    // speaker name/role rendering on each transcript segment.
    session: {
      speakerMap: {},            // raw operator-provided map (may be empty)
      effectiveSpeakerMap: {},   // what we actually render against — server picks default if no explicit map
      speakerMapSource: 'default', // 'explicit' | 'default'
      sessionContext: {},        // { speakerNames: {[id]: name}, … } — only `speakerNames` is consulted; names other than per-id explicit operator overrides are ignored.
    },
  };
  const SPEAKER_ASSIGNMENTS = [
    { role: 'host', name: 'HOST' },
    { role: 'cohost', name: 'COHOST' },
    { role: 'guest', name: 'GUEST 1' },
    { role: 'guest', name: 'GUEST 2' },
    { role: 'guest', name: 'GUEST 3' },
  ];

  function loadSpeakerPrefs() {
    try {
      const raw = JSON.parse(sessionStorage.getItem('sentinel_speaker_prefs') || '{}');
      return {
        speakerMap: raw.speakerMap && typeof raw.speakerMap === 'object' ? raw.speakerMap : {},
        speakerNames: raw.speakerNames && typeof raw.speakerNames === 'object' ? raw.speakerNames : {},
      };
    } catch {
      return { speakerMap: {}, speakerNames: {} };
    }
  }

  function saveSpeakerPrefs(speakerMap, speakerNames) {
    sessionStorage.setItem('sentinel_speaker_prefs', JSON.stringify({ speakerMap, speakerNames }));
  }

  const speakerPrefs = loadSpeakerPrefs();
  state.session.speakerMap = speakerPrefs.speakerMap;
  state.session.effectiveSpeakerMap = speakerPrefs.speakerMap;
  state.session.sessionContext = { speakerNames: speakerPrefs.speakerNames };

  // ─── Customize panel state ──────────────────────────────────
  // Source of truth for the four panel knobs. maxDisplayTier is derived from
  // strictness and read by renderSourceChips at every card paint.
  const LENGTH_STOPS = [20, 28, 40, 80];
  const LENGTH_LABELS = ['Concise', 'Default', 'Standard', 'Detailed'];
  const customize = {
    mode: 'producer',
    wordMax: 28,
    strictness: 'balanced',
    maxDisplayTier: 2,
    density: 'normal',
  };

  function strictnessToTier(s) {
    if (s === 'tier1') return 1;
    if (s === 'broad') return 3;
    return 2;
  }

  function lengthIndexFromWordMax(n) {
    // Snap an arbitrary wordMax to the nearest panel stop so the slider
    // always reflects a valid position when the server hydrates state.
    let best = 0;
    let bestDelta = Infinity;
    for (let i = 0; i < LENGTH_STOPS.length; i++) {
      const d = Math.abs(LENGTH_STOPS[i] - n);
      if (d < bestDelta) { best = i; bestDelta = d; }
    }
    return best;
  }

  function syncLengthControl(wordMax) {
    const slider = document.getElementById('customize-length');
    const valueEl = document.getElementById('customize-length-value');
    if (!slider || !valueEl) return;
    const idx = lengthIndexFromWordMax(wordMax);
    slider.value = String(idx);
    const pct = (idx / (LENGTH_STOPS.length - 1)) * 100;
    slider.style.setProperty('--slider-pct', `${pct}%`);
    valueEl.innerHTML = `${LENGTH_LABELS[idx]} <span class="customize-slider-num">${LENGTH_STOPS[idx]}</span>`;
  }

  function syncSegmented(groupId, value) {
    const buttons = document.querySelectorAll(`#${groupId} button`);
    buttons.forEach((b) => b.classList.toggle('active', b.dataset.value === value));
  }

  function syncCustomizeUI() {
    const modeEl = document.getElementById('customize-mode');
    if (modeEl) modeEl.value = customize.mode;
    syncLengthControl(customize.wordMax);
    syncSegmented('customize-strictness', customize.strictness);
    syncSegmented('customize-density', customize.density);
  }

  async function postModeChange(patch) {
    try {
      const r = await authFetch('/api/session/mode', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(patch),
      });
      if (!r.ok) {
        // Revert optimistic UI to last server-confirmed state.
        syncCustomizeUI();
        return;
      }
      const d = await r.json();
      if (d && d.applied) applyCustomizeApplied(d.applied);
    } catch {
      // authFetch handles 401; for other failures, revert the optimistic UI.
      syncCustomizeUI();
    }
  }

  function applyCustomizeApplied(applied) {
    if (applied.mode) customize.mode = applied.mode;
    if (typeof applied.wordMax === 'number') customize.wordMax = applied.wordMax;
    if (applied.strictness) {
      customize.strictness = applied.strictness;
      customize.maxDisplayTier = typeof applied.maxDisplayTier === 'number'
        ? applied.maxDisplayTier
        : strictnessToTier(applied.strictness);
    }
    if (applied.density) customize.density = applied.density;
    syncCustomizeUI();
    // Strictness changed display tier — repaint card chips.
    renderSidebar();
  }

  async function hydrateCustomizePanel() {
    try {
      const r = await authFetch('/api/session/mode');
      if (!r.ok) return;
      const d = await r.json();
      if (d && d.applied) applyCustomizeApplied(d.applied);
    } catch { /* auth handled by authFetch */ }
  }

  function bindCustomizePanel() {
    const panel = document.getElementById('customize-panel');
    const toggle = document.getElementById('customize-toggle');
    const modeEl = document.getElementById('customize-mode');
    const lengthEl = document.getElementById('customize-length');

    // Default: open on first load. After that, respect the operator's choice.
    const stored = sessionStorage.getItem('sentinel_customize_collapsed');
    if (stored === '1') panel.classList.add('collapsed');

    toggle.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      sessionStorage.setItem(
        'sentinel_customize_collapsed',
        panel.classList.contains('collapsed') ? '1' : '0',
      );
    });

    modeEl.addEventListener('change', () => {
      postModeChange({ mode: modeEl.value });
    });

    lengthEl.addEventListener('input', () => {
      const idx = parseInt(lengthEl.value, 10) || 0;
      syncLengthControl(LENGTH_STOPS[idx]);
    });
    lengthEl.addEventListener('change', () => {
      const idx = parseInt(lengthEl.value, 10) || 0;
      postModeChange({ wordMax: LENGTH_STOPS[idx] });
    });

    document.querySelectorAll('#customize-strictness button').forEach((b) => {
      b.addEventListener('click', () => postModeChange({ strictness: b.dataset.value }));
    });
    document.querySelectorAll('#customize-density button').forEach((b) => {
      b.addEventListener('click', () => postModeChange({ density: b.dataset.value }));
    });

    syncCustomizeUI();
  }

  const MAX_SEGMENTS = 250;
  const MAX_CARDS = 10;
  const FULL_CARDS = 2;

  const transcriptEl = document.getElementById('transcript');
  const sidebarEl = document.getElementById('sidebar');
  const statusEl = document.getElementById('status');
  const claimCountEl = document.getElementById('claim-count-display');
  const sidebarPane = document.getElementById('sidebar-pane');
  const followBanner = document.getElementById('follow-banner');
  let autoFollow = true;
  let pausedClaimCount = 0;

  sidebarPane.addEventListener('scroll', () => {
    // Newest cards render at the top of the sidebar (state.cards.unshift).
    // Treat scrollTop ≤ 50 as "following the newest"; anything farther
    // down means the operator is reading older cards — pause auto-follow.
    if (sidebarPane.scrollTop > 50) {
      autoFollow = false;
    } else {
      autoFollow = true;
      pausedClaimCount = 0;
      followBanner.classList.add('hidden');
    }
  });

  followBanner.addEventListener('click', () => {
    sidebarPane.scrollTop = 0;
    autoFollow = true;
    pausedClaimCount = 0;
    followBanner.classList.add('hidden');
  });

  // Docket-mode toggle: when true, sidebar collapses every card to a compact
  // accent-strip row (any row click-expandable). Default false = Live mode
  // (top 2 cards expanded, rest collapsed).
  let docketMode = false;
  if (claimCountEl) {
    claimCountEl.addEventListener('click', () => {
      docketMode = !docketMode;
      claimCountEl.classList.toggle('docket-mode-active', docketMode);
      renderSidebar();
    });
  }
  const statusLabelEl = statusEl.querySelector('.label');

  // ─── Utilities ──────────────────────────────────────────────
  const escape = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));

  function formatExplanationWithRefs(text) {
    // Replace [N] with styled citation ref spans.
    return escape(text).replace(/\[(\d+)\]/g, '<span class="citation-ref">[$1]</span>');
  }

  function truncate(text, n) {
    if (!text) return '';
    if (text.length <= n) return text;
    return text.slice(0, n).trim() + '…';
  }

  // Resolve a Deepgram speaker id to a display name + role class.
  //
  // Render policy (post-effectiveSpeakerMap):
  //   - Read from state.session.effectiveSpeakerMap first (server already
  //     applied the legacy 0=host/else=guest default when no explicit map
  //     was provided).
  //   - Safety net: if effectiveSpeakerMap is somehow empty (status hasn't
  //     polled yet, or server returned an empty object), apply the same
  //     legacy fallback inline so we never render the literal "SPEAKER N"
  //     for ids 0 and 1.
  //   - Names: sessionContext.speakerNames[id] sources both operator
  //     overrides AND registry-derived auto-bindings (host roster /
  //     YouTube title guests / transcript intro patterns). Display is
  //     first-name uppercase, full name when first-name is ambiguous
  //     across known speakers. Falls back to HOST/COHOST/GUEST when
  //     no name is bound for the id.
  // Speaker keys round-trip through JSON as strings, so look up by both forms.
  function resolveSpeaker(speakerId) {
    const map = state.session.effectiveSpeakerMap
      && Object.keys(state.session.effectiveSpeakerMap).length > 0
        ? state.session.effectiveSpeakerMap
        : (state.session.speakerMap || {});
    const ctx = state.session.sessionContext || {};
    let role = map[speakerId] ?? map[String(speakerId)];

    // Final safety net — if no role yet AND the map is empty, mirror the
    // classifier's legacy default so id 0/1 always resolve.
    if (!role && Object.keys(map).length === 0) {
      role = speakerId === 0 ? 'host' : 'guest';
    }

    const namesMap = ctx.speakerNames || {};
    const perId = namesMap[speakerId] ?? namesMap[String(speakerId)];
    const display = displayName(perId, namesMap);

    if (role === 'host')   return { role, name: display || 'HOST',   roleClass: 'role-host' };
    if (role === 'cohost') return { role, name: display || 'COHOST', roleClass: 'role-cohost' };
    if (role === 'guest')  return { role, name: display || 'GUEST',  roleClass: 'role-guest' };
    return { role: 'guest', name: display || 'GUEST', roleClass: 'role-guest' };
  }

  // First-name uppercase display, full-name fallback when ambiguous (two
  // speakers share a first name). Operator-edited names still feed in via
  // sessionContext.speakerNames so manual overrides render the same way.
  function displayName(perId, allNames) {
    if (!perId) return null;
    const firstName = perId.split(/\s+/)[0];
    if (!firstName) return perId.toUpperCase();
    const firstLower = firstName.toLowerCase();
    let dupes = 0;
    for (const n of Object.values(allNames || {})) {
      if (n && n.split(/\s+/)[0].toLowerCase() === firstLower) {
        dupes++;
        if (dupes > 1) break;
      }
    }
    return dupes > 1 ? perId.toUpperCase() : firstName.toUpperCase();
  }

  // Cache registry-derived speaker name/role from a transcript_segment broadcast.
  // Older segments + cards re-render via applyMetaToTranscript / renderSidebar.
  function applySpeakerNameFromSegment(seg) {
    if (!seg || !seg.speakerName) return;
    state.session.sessionContext = state.session.sessionContext || {};
    const names = state.session.sessionContext.speakerNames = state.session.sessionContext.speakerNames || {};
    const map = state.session.effectiveSpeakerMap = state.session.effectiveSpeakerMap || (state.session.speakerMap || {});
    const id = seg.speaker;
    let changed = false;
    if (names[id] !== seg.speakerName) { names[id] = seg.speakerName; changed = true; }
    if (seg.speakerRole && map[id] !== seg.speakerRole) { map[id] = seg.speakerRole; changed = true; }
    if (changed) {
      applyMetaToTranscript();
      renderSidebar();
    }
  }

  // Resolve a card's speaker for the claim-quote pill. Returns r.name as-is
  // (HOST/COHOST/GUEST, or an explicit operator-supplied name). Unmapped ids
  // fall back to generic GUEST attribution (per spec — never reuse a specific
  // name for an unknown speaker).
  function resolveCardSpeaker(card) {
    const id = typeof card.speakerNumber === 'number' ? card.speakerNumber : -1;
    const r = resolveSpeaker(id);
    if (r.role === null) {
      return { label: 'GUEST', roleClass: 'role-guest' };
    }
    return { label: r.name, roleClass: r.roleClass };
  }

  // Re-paint speaker labels on every existing segment. Called when session
  // metadata changes (e.g., a producer hits /api/session/start mid-show).
  function applyMetaToTranscript() {
    const els = transcriptEl.querySelectorAll('.seg[data-speaker]');
    for (const el of els) {
      const id = parseInt(el.dataset.speaker, 10);
      if (!Number.isFinite(id)) continue;
      const speakerEl = el.querySelector('.speaker');
      if (!speakerEl) continue;
      const { name, roleClass } = resolveSpeaker(id);
      speakerEl.textContent = name;
      speakerEl.className = `speaker ${roleClass}`;
      speakerEl.title = 'Click to assign speaker';
    }
  }

  async function assignSpeaker(speakerId) {
    if (!Number.isFinite(speakerId)) return;
    const map = { ...(state.session.speakerMap || {}) };
    const names = { ...((state.session.sessionContext || {}).speakerNames || {}) };
    const currentRole = map[speakerId] ?? map[String(speakerId)] ?? null;
    const currentName = names[speakerId] ?? names[String(speakerId)] ?? null;
    const currentIdx = SPEAKER_ASSIGNMENTS.findIndex((o) => o.role === currentRole && o.name === currentName);
    const next = SPEAKER_ASSIGNMENTS[(currentIdx + 1) % SPEAKER_ASSIGNMENTS.length];

    map[speakerId] = next.role;
    names[speakerId] = next.name;
    state.session.speakerMap = map;
    state.session.effectiveSpeakerMap = map;
    state.session.speakerMapSource = 'explicit';
    state.session.sessionContext = { ...(state.session.sessionContext || {}), speakerNames: names };
    saveSpeakerPrefs(map, names);
    applyMetaToTranscript();
    renderSidebar();

    try {
      await authFetch('/api/session/speakers', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ speakerMap: map, speakerNames: names }),
      });
    } catch { /* authFetch handles auth; keep local labels responsive */ }
  }

  async function refreshSessionMeta() {
    try {
      const r = await authFetch('/api/session/status');
      if (!r.ok) return;
      const d = await r.json();
      let changed = false;
      const serverHasExplicitMap = d.speakerMapSource === 'explicit'
        || (d.speakerMap && Object.keys(d.speakerMap).length > 0);
      if (serverHasExplicitMap && d.speakerMap && JSON.stringify(d.speakerMap) !== JSON.stringify(state.session.speakerMap)) {
        state.session.speakerMap = d.speakerMap;
        changed = true;
      }
      if (serverHasExplicitMap && d.effectiveSpeakerMap && JSON.stringify(d.effectiveSpeakerMap) !== JSON.stringify(state.session.effectiveSpeakerMap)) {
        state.session.effectiveSpeakerMap = d.effectiveSpeakerMap;
        changed = true;
      }
      if (d.speakerMapSource && d.speakerMapSource !== state.session.speakerMapSource) {
        state.session.speakerMapSource = d.speakerMapSource;
        // No re-paint needed — provenance is metadata only.
      }
      const serverHasExplicitNames = d.sessionContext
        && d.sessionContext.speakerNames
        && Object.keys(d.sessionContext.speakerNames).length > 0;
      if (serverHasExplicitNames && JSON.stringify(d.sessionContext) !== JSON.stringify(state.session.sessionContext)) {
        state.session.sessionContext = d.sessionContext;
        saveSpeakerPrefs(state.session.speakerMap || {}, d.sessionContext.speakerNames || {});
        changed = true;
      }
      if (changed) applyMetaToTranscript();
    } catch { /* tolerate transient fetch failures */ }
  }

  function fmtTimestamp(seconds) {
    if (typeof seconds !== 'number') return '';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function pulse(el) {
    if (!el) return;
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 240);
  }

  // ─── WebSocket ──────────────────────────────────────────────
  function wsUrl() {
    const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const base = `${proto}://${window.location.host}/ws`;
    return token ? `${base}?token=${encodeURIComponent(token)}` : base;
  }

  let ws;
  let reconnectTimer;

  function setStatus(state, label) {
    statusEl.classList.remove('connected', 'disconnected', 'degraded', 'offline');
    statusEl.classList.add(state);
    statusLabelEl.textContent = label;
  }

  function connect() {
    if (ws && ws.readyState !== WebSocket.CLOSED) return;
    setStatus('disconnected', 'connecting…');
    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      scheduleReconnect();
      return;
    }
    ws.addEventListener('open', () => setStatus('connected', 'live'));
    ws.addEventListener('close', () => {
      setStatus('disconnected', 'disconnected');
      scheduleReconnect();
    });
    ws.addEventListener('error', () => {
      setStatus('disconnected', 'error');
    });
    ws.addEventListener('message', (event) => {
      const wsReceivedMs = Date.now();
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      handleMessage(msg, wsReceivedMs);
    });
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  }

  function handleMessage(msg, wsReceivedMs) {
    switch (msg.type) {
      case 'transcript_segment':
        applySpeakerNameFromSegment(msg.data);
        addSegment(msg.data);
        break;
      case 'claim_card':
        addCard(msg, wsReceivedMs);
        break;
      case 'claim_progress':
        updatePendingClaim(msg);
        break;
      case 'pipeline_stats':
        renderPipelineStats(msg);
        break;
      case 'status':
        if (msg.classifierHealth) {
          state.classifierHealth = msg.classifierHealth;
          const cls = msg.classifierHealth === 'live' ? 'connected' : msg.classifierHealth;
          setStatus(cls, msg.classifierHealth);
          if (state.cards.length === 0 && state.pending.size === 0) renderSidebar();
        } else if (msg.state === 'connected') setStatus('connected', 'live');
        else if (msg.state === 'ollama_down') setStatus('connected', 'live · ollama down');
        break;
      case 'session_state':
        session.state = msg.state;
        if (msg.url !== undefined) session.url = msg.url || null;
        if (msg.state === 'idle') { session.url = null; session.error = null; hidePipelineStats(); }
        if (msg.state === 'connecting') session.error = null;
        if (msg.state === 'error' && msg.error) session.error = msg.error;
        renderSessionBar();
        break;
      case 'deepgram_health':
        session.deepgramHealth = { state: msg.state, attempt: msg.attempt };
        if (session.state === 'live') renderSessionBar();
        break;
      // claim_detected is informational; we wait for the synthesized card.
    }
  }

  // ─── Transcript rendering ──────────────────────────────────
  function addSegment(seg) {
    state.segments.push(seg);
    while (state.segments.length > MAX_SEGMENTS) {
      const dropped = state.segments.shift();
      if (dropped) state.segmentsWithClaims.delete(dropped.id);
    }

    if (state.segments.length === 1) transcriptEl.innerHTML = '';

    const el = document.createElement('div');
    el.className = 'seg';
    el.dataset.segmentId = seg.id;
    el.dataset.speaker = String(seg.speaker);
    const { name: speakerName, roleClass: speakerRoleClass } = resolveSpeaker(seg.speaker);
    el.innerHTML = `
      <span class="speaker ${speakerRoleClass}">${escape(speakerName)}</span>
      <span class="text">${escape(seg.text)}</span>
      <span class="ts">${fmtTimestamp(seg.timestamp)}</span>
    `;
    const speakerEl = el.querySelector('.speaker');
    if (speakerEl) {
      speakerEl.title = 'Click to assign speaker';
      speakerEl.addEventListener('click', (e) => {
        e.stopPropagation();
        assignSpeaker(seg.speaker);
      });
    }
    el.addEventListener('click', () => {
      // Only react if this segment has a claim attached.
      if (!el.classList.contains('has-claim')) return;
      const card = sidebarEl.querySelector(`[data-claim-id="${CSS.escape(seg.id)}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        pulse(card);
      }
    });
    transcriptEl.appendChild(el);

    // If a claim already arrived for this segment id (rare race), mark it.
    if (state.segmentsWithClaims.has(seg.id)) {
      el.classList.add('has-claim');
    }

    // Trim DOM to match state.segments length.
    while (transcriptEl.children.length > state.segments.length) {
      transcriptEl.removeChild(transcriptEl.firstChild);
    }

    // Auto-scroll to bottom unless the user has scrolled up.
    const pane = document.getElementById('transcript-pane');
    const atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 80;
    if (atBottom) pane.scrollTop = pane.scrollHeight;
  }

  function markSegmentAsClaim(segmentId) {
    state.segmentsWithClaims.add(segmentId);
    const segEl = transcriptEl.querySelector(`[data-segment-id="${CSS.escape(segmentId)}"]`);
    if (segEl) segEl.classList.add('has-claim');
  }

  // ─── Card rendering ─────────────────────────────────────────
  // Pull a short publisher name + year for chip display. Returns null when
  // we can't extract a sensible name — caller falls back to the "N sources"
  // count.
  function extractChipData(c) {
    let name = '';
    if (c.url) {
      try {
        const host = new URL(c.url).hostname.replace(/^www\./, '');
        const parts = host.split('.');
        const stem = parts.length >= 2 ? parts[parts.length - 2] : host;
        name = stem.charAt(0).toUpperCase() + stem.slice(1);
      } catch {}
    }
    if (!name && c.title) {
      name = c.title.split(/[\s—\-:|]+/).slice(0, 3).join(' ');
    }
    if (!name) return null;
    const yearMatch = ((c.title || '') + ' ' + (c.url || '')).match(/\b(?:19|20)\d{2}\b/);
    return { name, year: yearMatch ? yearMatch[0] : '', tier: c.tier };
  }

  function renderSourceChips(citations) {
    if (!citations || citations.length === 0) return null;
    // Strictness filter (display-only — citations themselves and the Docket
    // verdict are unchanged; this hides chips above the chosen tier).
    const visible = citations.filter((c) => (c.tier || 99) <= customize.maxDisplayTier);
    if (visible.length === 0) return null;
    const pairs = visible
      .map((c) => ({ citation: c, chip: extractChipData(c) }))
      .filter((p) => p.chip);
    if (pairs.length === 0) return null;
    const wrapper = document.createElement('span');
    wrapper.className = 'source-chips';
    pairs.slice(0, 2).forEach(({ citation, chip }) => {
      const el = document.createElement('span');
      el.className = `source-chip tier-${chip.tier}`;
      el.textContent = chip.year ? `${chip.name} · ${chip.year}` : chip.name;
      el.dataset.title = citation.title || '';
      el.dataset.tier = String(citation.tier || '');
      if (citation.snippet) el.dataset.snippet = citation.snippet;
      if (citation.url) {
        el.dataset.url = citation.url;
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(citation.url).catch(() => {});
        });
      }
      wrapper.appendChild(el);
    });
    if (pairs.length > 2) {
      const more = document.createElement('span');
      more.className = 'source-chip-more';
      more.textContent = `+${pairs.length - 2} more`;
      wrapper.appendChild(more);
    }
    return wrapper;
  }

  // ─── Citation hover tooltip (single reusable element) ────────────
  const citationTooltipEl = document.getElementById('citation-tooltip');
  let citationTooltipHideTimer = null;
  function showCitationTooltip(chipEl) {
    if (citationTooltipHideTimer) {
      clearTimeout(citationTooltipHideTimer);
      citationTooltipHideTimer = null;
    }
    const title = chipEl.dataset.title || '';
    const snippet = chipEl.dataset.snippet || '';
    const tier = chipEl.dataset.tier || '';
    const url = chipEl.dataset.url || '';
    const tierHtml = tier
      ? `<span class="tt-tier tier-${escape(tier)}">T${escape(tier)}</span>`
      : '<span></span>';
    const copyHint = url ? '<span>Click to copy URL</span>' : '<span></span>';
    const snippetHtml = snippet ? `<div class="tt-snippet">${escape(snippet)}</div>` : '';
    citationTooltipEl.innerHTML =
      `<div class="tt-title">${escape(title)}</div>` +
      snippetHtml +
      `<div class="tt-meta">${tierHtml}${copyHint}</div>`;
    citationTooltipEl.classList.add('visible');
    const chipRect = chipEl.getBoundingClientRect();
    const ttRect = citationTooltipEl.getBoundingClientRect();
    let left = chipRect.left + chipRect.width / 2 - ttRect.width / 2;
    let top = chipRect.top - ttRect.height - 8;
    if (top < 10) top = chipRect.bottom + 8; // flip below if near top of viewport
    if (left < 10) left = 10;
    if (left + ttRect.width > window.innerWidth - 10) {
      left = window.innerWidth - ttRect.width - 10;
    }
    citationTooltipEl.style.left = left + 'px';
    citationTooltipEl.style.top = top + 'px';
  }
  function hideCitationTooltip() {
    if (citationTooltipHideTimer) clearTimeout(citationTooltipHideTimer);
    citationTooltipHideTimer = setTimeout(() => {
      citationTooltipEl.classList.remove('visible');
      citationTooltipHideTimer = null;
    }, 100);
  }
  document.addEventListener('mouseover', (e) => {
    const chip = e.target.closest('.source-chip');
    if (chip) showCitationTooltip(chip);
  });
  document.addEventListener('mouseout', (e) => {
    const chip = e.target.closest('.source-chip');
    if (chip) hideCitationTooltip();
  });
  citationTooltipEl.addEventListener('mouseenter', () => {
    if (citationTooltipHideTimer) {
      clearTimeout(citationTooltipHideTimer);
      citationTooltipHideTimer = null;
    }
  });
  citationTooltipEl.addEventListener('mouseleave', hideCitationTooltip);

  const pipelineStatsEl = document.getElementById('pipeline-stats');
  function renderPipelineStats(msg) {
    // Server only emits during non-idle sessions; once the bar receives any
    // message it stays visible until session_state→idle hides it.
    pipelineStatsEl.classList.remove('hidden');
    const unevalN = msg.uneval || 0;
    const unevalCls = unevalN > 0 ? 'stat-uneval-warn' : 'stat-uneval-zero';
    pipelineStatsEl.innerHTML =
      `Seg <span class="stat-num">${msg.segments}</span>` +
      `<span class="stat-sep">|</span>` +
      `Heard <span class="stat-num">${msg.claimsHeard}</span>` +
      `<span class="stat-sep">|</span>` +
      `Cards <span class="stat-num">${msg.cards}</span>` +
      `<span class="stat-sep">|</span>` +
      `Sup <span class="stat-num">${msg.suppressed}</span>` +
      `<span class="stat-sep">|</span>` +
      `Uneval <span class="${unevalCls}">${unevalN}</span>`;
    state.latestStats = msg;
    if (state.cards.length === 0 && state.pending.size === 0) renderSidebar();
  }
  function hidePipelineStats() {
    pipelineStatsEl.classList.add('hidden');
    pipelineStatsEl.innerHTML = '';
  }

  function updatePendingClaim(msg) {
    // Coalesce: same claimId stays in the same Map slot; stage advances.
    state.pending.set(msg.claimId, {
      stage: msg.stage,
      primaryEntity: msg.primaryEntity || '',
      claimText: msg.claimText || '',
      updatedAt: Date.now(),
    });
    // Periodic sweep for orphans — claims that never produced a verdict
    // (Docket suppressed, retrieval threw, etc.).
    const now = Date.now();
    for (const [id, p] of state.pending) {
      if (now - p.updatedAt > PENDING_TTL_MS) state.pending.delete(id);
    }
    renderSidebar();
  }

  function pendingStageLabel(stage) {
    if (stage === 'retrieving') return 'Searching sources…';
    if (stage === 'analyzing') return 'Analyzing evidence…';
    return 'Claim detected';
  }

  function addCard(card, wsReceivedMs) {
    state.cards.unshift(card);
    while (state.cards.length > MAX_CARDS) state.cards.pop();
    markSegmentAsClaim(card.claimId);
    // Final verdict landed — drop the pending placeholder for this claim.
    state.pending.delete(card.claimId);
    renderSidebar();
    if (!autoFollow) {
      pausedClaimCount++;
      followBanner.textContent = `${pausedClaimCount} new claim${pausedClaimCount === 1 ? '' : 's'} ↑`;
      followBanner.classList.remove('hidden');
    }
    // Notify server that the card DOM is mounted, for TTFC delta computation.
    if (ws && ws.readyState === WebSocket.OPEN) {
      try {
        ws.send(JSON.stringify({
          type: 'card_rendered',
          claimId: card.claimId,
          wsReceivedMs,
          renderCompleteMs: Date.now(),
        }));
      } catch (e) {
        // Non-fatal — server-side TTFC pairing will just miss this claim.
      }
    }
  }

  function renderSidebar() {
    const savedScrollTop = autoFollow ? null : sidebarPane.scrollTop;
    // Keep the static "THE DOCKET / N CLAIMS" header in sync with live state.
    const countEl = document.getElementById('claim-count-display');
    if (countEl) {
      const n = state.cards.length;
      countEl.textContent = `${n} CLAIM${n !== 1 ? 'S' : ''}`;
    }

    // Pending claims always render above real cards, newest-first by
    // updatedAt. Listening-empty-state is preserved when nothing pending.
    const pendingEntries = Array.from(state.pending.entries())
      .map(([id, p]) => ({ id, ...p }))
      .sort((a, b) => b.updatedAt - a.updatedAt);

    if (state.cards.length === 0 && pendingEntries.length === 0) {
      const s = state.latestStats;
      const hasFlow = s && (s.claimsHeard > 0 || s.segments > 0);
      const statsLine = hasFlow
        ? `<div class="empty-state-stats">${s.claimsHeard} claims heard · ${s.suppressed} filtered · ${s.cards} cards shown</div>`
        : '';
      const ch = state.classifierHealth || 'live';
      const primary = ch === 'degraded'
        ? 'Fallback classifier active. Extraction quality may vary.'
        : ch === 'offline'
        ? 'Classifier unavailable. No claims being evaluated.'
        : 'Listening for checkable claims';
      sidebarEl.innerHTML =
        '<div class="empty-state empty-state-listening">' +
          `<div class="empty-state-primary">${primary}</div>` +
          '<div class="empty-state-sub">Classifier active · Sources ready</div>' +
          statsLine +
        '</div>';
      return;
    }
    sidebarEl.innerHTML = '';
    for (const p of pendingEntries) {
      const el = document.createElement('div');
      el.className = 'pending-claim-card';
      el.dataset.claimId = p.id;
      el.innerHTML =
        `<div><span class="pending-entity">${escape(p.primaryEntity || 'Claim detected')}</span></div>` +
        `<div class="pending-stage">${escape(pendingStageLabel(p.stage))}</div>`;
      sidebarEl.appendChild(el);
    }
    if (state.cards.length === 0) {
      // Only pending entries — done, no real cards to render yet.
      return;
    }

    // Docket mode: every card renders as a compact collapsed accent-strip row.
    if (docketMode) {
      for (const card of state.cards) {
        sidebarEl.appendChild(renderCollapsedCard(card));
      }
      if (savedScrollTop !== null) sidebarPane.scrollTop = savedScrollTop;
      return;
    }

    const recent = state.cards.slice(0, FULL_CARDS);
    const earlier = state.cards.slice(FULL_CARDS);

    recent.forEach((card, idx) => {
      const fullEl = renderFullCard(card);
      // Animate only the newest card; others are stable across re-renders.
      if (idx === 0) fullEl.classList.add('is-new');
      sidebarEl.appendChild(fullEl);
    });

    if (earlier.length > 0) {
      const divider = document.createElement('hr');
      divider.className = 'earlier-divider';
      sidebarEl.appendChild(divider);

      const label = document.createElement('div');
      label.className = 'earlier-label';
      label.textContent = `Earlier (${earlier.length})`;
      sidebarEl.appendChild(label);

      for (const card of earlier) {
        sidebarEl.appendChild(renderCollapsedCard(card));
      }
    }
    if (savedScrollTop !== null) sidebarPane.scrollTop = savedScrollTop;
  }

  function verdictClass(v) {
    return (v || 'unverifiable').toLowerCase();
  }

  function renderFullCard(card) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.claimId = card.claimId;
    // Verdict accent strip is driven by data-verdict via CSS attribute selectors.
    // Mirror the collapsed-card fallback so the strip is always present.
    el.dataset.verdict = card.docket?.verdict || 'UNVERIFIABLE';
    el.addEventListener('click', (e) => {
      // Don't sync-scroll when clicking interactive children.
      if (e.target.closest('.citations-toggle, .citation, .contradiction')) return;
      const segEl = transcriptEl.querySelector(`[data-segment-id="${CSS.escape(card.claimId)}"]`);
      if (segEl) {
        segEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        pulse(segEl);
      }
    });

    const docket = card.docket;

    // 2) Speaker + claim quote — use the original Deepgram id (card.speakerNumber)
    // to resolve the actual person's name. Falls back to "Speaker N" for any
    // unmapped id (per spec, never reuse guestName for unknown speakers).
    const claimQuote = document.createElement('div');
    claimQuote.className = 'claim-text-quote';
    const cardSpk = resolveCardSpeaker(card);
    claimQuote.innerHTML = `<span class="speaker-pill ${cardSpk.roleClass}">${escape(cardSpk.label)}:</span> "${escape(card.claimText)}"`;
    el.appendChild(claimQuote);

    // 3) Verdict pill + explanation
    if (docket) {
      if (docket.grounding) {
        const g = document.createElement('div');
        g.className = 'grounding';
        g.innerHTML = formatExplanationWithRefs(docket.grounding);
        el.appendChild(g);
      }

      const vrow = document.createElement('div');
      vrow.className = 'verdict-row';
      vrow.innerHTML = `<span class="pill ${verdictClass(docket.verdict)}">${escape(docket.verdict)}</span>`;
      el.appendChild(vrow);

      const exp = document.createElement('div');
      exp.className = 'explanation';
      exp.innerHTML = formatExplanationWithRefs(docket.explanation);
      el.appendChild(exp);

      const lanceHits = (docket.citations || []).filter((c) => c.url === null);
      if (lanceHits.length > 0) {
        const badge = document.createElement('div');
        badge.className = 'memory-badge';
        const epMatch = lanceHits[0].title.match(/TWiST Ep (\d+)/);
        badge.textContent = epMatch ? `TWiST Memory · Ep ${epMatch[1]}` : 'TWiST Memory';
        el.appendChild(badge);
      }

      // 4) Citations — collapsed by default
      if (docket.citations && docket.citations.length > 0) {
        const toggle = document.createElement('div');
        toggle.className = 'citations-toggle';
        const n = docket.citations.length;
        const chips = renderSourceChips(docket.citations);
        if (chips) {
          toggle.innerHTML = `<span class="caret">▸</span> `;
          toggle.appendChild(chips);
        } else {
          toggle.innerHTML = `<span class="caret">▸</span> ${n} ${n === 1 ? 'source' : 'sources'}`;
        }

        const list = document.createElement('div');
        list.className = 'citations-list';
        docket.citations.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'citation';
          if (c.url) {
            row.innerHTML = `
              <span class="num">[${i + 1}]</span>
              <span class="title" title="Click to copy URL">${escape(c.title)}</span>
              <span class="tier">T${c.tier}</span>
            `;
            row.querySelector('.title').addEventListener('click', (e) => {
              e.stopPropagation();
              copyToClipboard(c.url, row);
            });
          } else {
            row.classList.add('archive');
            row.innerHTML = `
              <span class="num">[${i + 1}]</span>
              <span class="title">${escape(c.title)}</span>
              <span class="archive-label">— show archive</span>
              <span class="tier">T${c.tier}</span>
            `;
          }
          list.appendChild(row);
        });

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          toggle.classList.toggle('open');
          list.classList.toggle('open');
        });

        el.appendChild(toggle);
        el.appendChild(list);
      }
    } else {
      // Docket suppressed — show a small note
      const note = document.createElement('div');
      note.className = 'explanation';
      note.style.color = 'var(--text-faint)';
      note.style.fontStyle = 'italic';
      note.textContent = 'No fact-check available (no sources retrieved).';
      el.appendChild(note);
    }

    return el;
  }

  function renderCollapsedCard(card) {
    const el = renderFullCard(card);
    el.classList.add('collapsed');
    const verdict = card.docket?.verdict || 'UNVERIFIABLE';
    const pill = document.createElement('span');
    pill.className = `pill ${verdictClass(verdict)}`;
    pill.textContent = verdict;
    const truncatedClaim = document.createElement('span');
    truncatedClaim.className = 'truncated-claim';
    truncatedClaim.textContent = truncate(card.claimText, 60);
    el.insertBefore(truncatedClaim, el.firstChild);
    el.insertBefore(pill, el.firstChild);
    el.addEventListener('click', (e) => {
      if (e.target.closest('.citations-toggle, .citation, .contradiction')) return;
      el.classList.toggle('expanded');
    });
    return el;
  }

  // ─── Clipboard ──────────────────────────────────────────────
  async function copyToClipboard(text, rowEl) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    rowEl.classList.add('copied');
    setTimeout(() => rowEl.classList.remove('copied'), 1500);
  }

  // ─── Boot ───────────────────────────────────────────────────
  // /api/status is the auth canary. On 200 (or auth-disabled server) we
  // proceed to open the WS. On 401, authFetch surfaces the overlay and
  // we skip connect() — browser WS can't distinguish 401 from network
  // failure in its close event, so the fetch is our reliable signal.
  (async function boot() {
    try {
      const r = await authFetch('/api/status');
      if (!r.ok) {
        promptForToken('Auth check failed');
        return;
      }
    } catch {
      return;
    }
    // Seed the session bar from server state before opening the WS, so a
    // reload mid-stream renders 'live' immediately instead of flashing idle.
    try {
      const r = await authFetch('/api/session/status');
      if (r.ok) {
        const d = await r.json();
        if (d && typeof d.state === 'string') {
          session.state = d.state;
          session.url = d.url || null;
          session.error = d.error || null;
        }
      }
    } catch {}
    renderSessionBar();
    refreshSessionMeta();
    setInterval(refreshSessionMeta, 10000);
    bindCustomizePanel();
    hydrateCustomizePanel();
    connect();
  })();
})();
</script>
</body>
</html>
